services:
  zeta:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      PORT: ${PORT:-8000}
      PYTHONPATH: /app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
